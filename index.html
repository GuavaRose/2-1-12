<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17756F">
<title>大家喜愛的朋友</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: classroom projector stage. Step bar on top, big stage in the middle, the four "keys" rail at the bottom; teacher drawer slides in from the right. */
:root{
  --bg:#EEF4F2;        /* chalk-mint wall */
  --surface:#FFFFFF;
  --ink:#1D2B2A;
  --muted:#5C6E6C;
  --line:#CFDDDA;
  --teal:#17756F;      /* 掛圖裡的制服綠 */
  --teal-soft:#D5ECE8;
  --apple:#D2483B;     /* 金蘋果、刀子 */
  --gold:#E3A72F;
  --gold-soft:#FBEFD2;
  --good:#2E8B57;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#122120;--surface:#1B2D2C;--ink:#E8F1EF;--muted:#9FB3B0;--line:#2E4644;
  --teal:#4FC1B7;--teal-soft:#1F3E3B;--apple:#F07466;--gold:#F2C35A;--gold-soft:#3A3220;--good:#5FCB8C;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#122120;--surface:#1B2D2C;--ink:#E8F1EF;--muted:#9FB3B0;--line:#2E4644;
  --teal:#4FC1B7;--teal-soft:#1F3E3B;--apple:#F07466;--gold:#F2C35A;--gold-soft:#3A3220;--good:#5FCB8C;color-scheme:dark}

html,body{height:100%;margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:10px;padding-block:10px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.25rem;white-space:nowrap}
.brand small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);margin-left:6px}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.step{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem;display:flex;gap:6px;align-items:center}
.step .m{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
.step[aria-current="true"]{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.step[aria-current="true"] .m{color:var(--surface);opacity:.8}
.tools{display:flex;gap:8px;align-items:center}
.tbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px;font-size:.88rem}
.tbtn[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.clock{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted);min-width:4.5em;text-align:right}

/* middle */
.mid{flex:1;min-height:0;display:flex;gap:12px}
.stage{flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:clamp(16px,2.4vw,36px);overflow:auto;display:flex;flex-direction:column;gap:clamp(12px,1.6vw,22px)}
.drawer{width:min(380px,40vw);flex:none;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;overflow:auto;font-size:.93rem}
.drawer h3{font-family:var(--f-display);font-weight:400;font-size:1.15rem;margin:0 0 8px}
.drawer h4{font-size:.8rem;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}
.drawer ul{margin:0;padding-left:1.2em}
.drawer li{margin:3px 0}
.drawer .note{background:var(--gold-soft);border-radius:10px;padding:10px 12px;margin-top:8px}
.drawer textarea{width:100%;min-height:150px;border:1.5px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem}
.drawer .hint{color:var(--muted);font-size:.82rem}

/* stage typography */
.eyebrow{font-size:clamp(.8rem,1vw,1rem);letter-spacing:.12em;color:var(--teal);font-weight:700}
.q{font-family:var(--f-display);font-size:clamp(1.6rem,3.6vw,3.2rem);line-height:1.3;margin:0;text-wrap:balance}
.q2{font-family:var(--f-display);font-size:clamp(1.25rem,2.4vw,2.1rem);line-height:1.35;margin:0;text-wrap:balance}
.verse{font-family:var(--f-display);font-size:clamp(1.4rem,3vw,2.7rem);line-height:1.45;margin:0;text-wrap:balance}
.ref{font-size:clamp(.9rem,1.3vw,1.2rem);color:var(--muted)}
.row{display:flex;gap:clamp(12px,2vw,28px);flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 16px;background:var(--teal-soft);color:var(--ink);font-size:clamp(1rem,1.6vw,1.4rem)}
.bigbtn{border:2px solid var(--teal);background:var(--surface);border-radius:14px;padding:10px 20px;font-size:clamp(1rem,1.5vw,1.3rem)}
.bigbtn.solid{background:var(--teal);color:var(--surface)}
.subtabs{display:flex;gap:8px;flex-wrap:wrap}
.subtabs button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 14px}
.subtabs button[aria-selected="true"]{border-color:var(--teal);background:var(--teal-soft)}

/* step 1 traits */
.traits{display:flex;flex-wrap:wrap;gap:12px;min-height:60px}
.trait{font-family:var(--f-display);font-size:clamp(1.2rem,2.4vw,2rem);background:var(--gold-soft);border:2px solid var(--gold);border-radius:16px;padding:6px 18px;animation:pop .35s ease-out}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow input{flex:1;min-width:0;max-width:420px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;font-size:1.05rem;background:var(--bg);color:var(--ink)}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:none;opacity:1}}

/* step 2 chart */
.chartwrap{position:relative;width:100%;max-width:min(100%,calc((100vh - 300px) * 1.42));margin:0 auto;aspect-ratio:1500/1056}
.chartwrap img{width:100%;height:100%;display:block;border-radius:10px}
.cover{position:absolute;border:3px dashed var(--teal);background:var(--teal-soft);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px;font-family:var(--f-display);font-size:clamp(.85rem,1.7vw,1.6rem);color:var(--teal);transition:opacity .4s, transform .4s}
.cover.open{opacity:0;transform:scale(.96);pointer-events:none}

/* step 3 knife or medicine */
.kmgame{display:grid;grid-template-columns:1fr;gap:16px;justify-items:center;text-align:center}
.sentence{font-family:var(--f-display);font-size:clamp(1.6rem,4vw,3.4rem);line-height:1.3;min-height:1.4em;text-wrap:balance}
.verdict{display:flex;gap:clamp(16px,4vw,60px);justify-content:center}
.vcard{width:clamp(120px,16vw,200px);aspect-ratio:1;border-radius:22px;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--bg);font-family:var(--f-display);font-size:clamp(1.1rem,1.8vw,1.6rem);transition:transform .25s, border-color .25s, opacity .25s}
.vcard svg{width:55%;height:auto}
.vcard.win{transform:scale(1.08)}
.vcard.knife.win{border-color:var(--apple)}
.vcard.med.win{border-color:var(--good)}
.vcard.lose{opacity:.3}
.kmnav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.counter{color:var(--muted);font-variant-numeric:tabular-nums}

/* reveal list */
.reveal{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.reveal li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(1.15rem,2.2vw,1.9rem);font-family:var(--f-display);line-height:1.35}
.reveal li .n{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--teal);color:var(--surface);display:flex;align-items:center;justify-content:center;font-size:.8em}
.reveal li.hidden{opacity:.12}

/* verse memorize */
.mem{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.mem span{font-family:var(--f-display);font-size:clamp(1.8rem,4.6vw,4rem);padding:2px 8px;border-radius:12px;transition:background .3s,color .3s}
.mem span.blank{background:var(--teal-soft);color:transparent}

/* step 6 ladder */
.ladderbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ladderbar select{border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);color:var(--ink);font:inherit}
.ladderbox{display:flex;gap:clamp(12px,2vw,24px);flex-wrap:wrap;min-height:0}
.ladderbox .svgwrap{flex:1 1 320px;min-width:0}
.ladderbox svg{width:100%;height:auto;display:block;max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px)}
.lnum{cursor:pointer}
.lnum circle{fill:var(--surface);stroke:var(--teal);stroke-width:3}
.lnum text{fill:var(--teal);font-family:var(--f-display);font-size:26px}
.lnum.used circle{fill:var(--line);stroke:var(--line)}
.lnum.used text{fill:var(--muted)}
.lnum:hover circle{fill:var(--teal-soft)}
.rail{stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.rung{stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.trail{fill:none;stroke:var(--apple);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.lcard rect{fill:var(--gold-soft);stroke:var(--gold);stroke-width:2.5}
.lcard text{fill:var(--ink);font-family:var(--f-display);font-size:22px}
.lcard.open rect{fill:var(--surface);stroke:var(--apple);stroke-width:3}
.cardpanel{flex:1 1 300px;min-width:0;border:2px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.cardpanel .q2{font-size:clamp(1.15rem,2vw,1.8rem)}
.cardpanel .ask{font-size:clamp(1rem,1.5vw,1.3rem);margin:0;padding-left:1.2em}
.cardpanel .empty{color:var(--muted);font-size:1.05rem}
.kinds{display:flex;flex-wrap:wrap;gap:8px}
.kinds button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;font-size:clamp(.95rem,1.3vw,1.15rem)}
.kinds button.right{border-color:var(--good);background:var(--good);color:var(--surface)}
.kinds button.miss{opacity:.45}
.fb{font-family:var(--f-display);font-size:1.2rem;min-height:1.5em}

/* bottom rail: four keys */
.keys{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.keys .lbl{font-size:.8rem;color:var(--muted);letter-spacing:.08em}
.key{border:2px dashed var(--line);border-radius:12px;padding:6px 14px;font-family:var(--f-display);font-size:clamp(.95rem,1.4vw,1.2rem);color:var(--muted);background:transparent}
.key.on{border-style:solid;border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.nav{margin-left:auto;display:flex;gap:8px}
.nav button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 16px}

button{touch-action:manipulation}
@media (max-width:820px){
  .app{height:auto;min-height:100%}
  .mid{flex-direction:column}
  .stage{overflow:visible}
  .drawer{width:auto}
  .steps{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;flex-basis:100%;order:3}
  .step{flex:none}
  .keys{padding-bottom:env(safe-area-inset-bottom,0px)}
  .keys .key{font-size:.85rem;padding:4px 10px}
  .ladderbox svg{max-height:none}
  .nav{margin-left:auto}
  .nav button{padding:10px 18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">大家喜愛的朋友<small>第十二課</small></div>
    <nav class="steps" id="steps" aria-label="課程段落"></nav>
    <div class="tools">
      <span class="clock" id="clock" title="上課計時">00:00</span>
      <button class="tbtn" id="clockBtn" type="button">開始計時</button>
      <button class="tbtn" id="teachBtn" type="button" aria-pressed="true">教員提示</button>
    </div>
  </header>

  <div class="mid">
    <main class="stage" id="stage" aria-live="polite"></main>
    <aside class="drawer" id="drawer" aria-label="教員提示"></aside>
  </div>

  <footer class="keys">
    <span class="lbl">四個重點</span>
    <span class="key" data-k="0">說話前先想一想</span>
    <span class="key" data-k="1">行動前先等一等</span>
    <span class="key" data-k="2">包容與和好</span>
    <span class="key" data-k="3">幫助對的事</span>
    <div class="nav">
      <button type="button" id="prevBtn">← 上一段</button>
      <button type="button" id="nextBtn">下一段 →</button>
    </div>
  </footer>
</div>

  $("#steps").innerHTML = STEPS.map((s,i)=>`<button type="button" class="step" data-i="${i}" aria-current="${i===st.step}">${s.name}<span class="m">${s.min}′</span></button>`).join("");
  // keys rail
  document.querySelectorAll(".key").forEach(k=>k.classList.toggle("on", st.keysOn.has(+k.dataset.k)));
  drawer.innerHTML = NOTES[st.step];
  const fn = [r1,r2,r3,r4,r5,r6,r7][st.step];
  fn();
  const ta = $("#kmEdit");
  if(ta){ ta.value = kmText; ta.addEventListener("input",()=>{ kmText = ta.value; try{localStorage.setItem("l12-km",kmText)}catch(e){} st.km={i:0,shown:null}; if(st.sub===1) r3(); }); }
  $("#prevBtn").disabled = st.step===0;
  $("#nextBtn").disabled = st.step===STEPS.length-1;
}

function r1(){
  stage.innerHTML = `
  <div class="eyebrow">前言</div>
  <p class="q">你在學校有沒有特別喜歡的朋友？<br>為什麼喜歡他？</p>
  <div class="traits" id="traits">${st.traits.map(t=>`<span class="trait">${esc(t)}</span>`).join("")}</div>
  <form class="addrow" id="traitForm"><input id="traitIn" placeholder="輸入孩子說的特質，例如：樂意幫忙" autocomplete="off" aria-label="新增特質"><button class="bigbtn solid" type="submit">加上去</button>${st.traits.length?`<button class="bigbtn" type="button" id="traitUndo">刪掉最後一個</button>`:""}</form>`;
  $("#traitForm").addEventListener("submit",e=>{e.preventDefault(); const v=$("#traitIn").value.trim(); if(v){st.traits.push(v); r1(); $("#traitIn").focus();}});
  const u=$("#traitUndo"); if(u) u.onclick=()=>{st.traits.pop(); r1();};
}

function r2(){
  const done = st.cover[0]&&st.cover[1];
  stage.innerHTML = `
  <div class="row"><div class="grow"><div class="eyebrow">小恩的故事</div>
  <p class="q2">${done?"小恩要怎麼做，別人才會喜歡跟他做朋友？":"為什麼大家都不想跟小恩玩？"}</p></div>
  <button class="bigbtn" type="button" id="resetCover">重新遮住</button></div>
  <div class="chartwrap">
    <img src="${CHART}" alt="掛圖：小恩哭著向老師訴苦，同學小齊和小希說出原因">
    <button type="button" class="cover ${st.cover[0]?"open":""}" data-c="0" style="left:53.6%;top:22%;width:43.8%;height:20.6%">按一下，看小齊說什麼</button>
    <button type="button" class="cover ${st.cover[1]?"open":""}" data-c="1" style="left:53.6%;top:75.8%;width:43.8%;height:20.2%">按一下，看小希說什麼</button>
  </div>`;
  stage.querySelectorAll(".cover").forEach(b=>b.onclick=()=>{st.cover[+b.dataset.c]=true; r2();});
  $("#resetCover").onclick=()=>{st.cover=[false,false]; r2();};
}

function r3(){
  const tabs = ["金蘋果","刀子還是藥","行動前先等一等"];
  let body="";
  if(st.sub===0){
    body = `<div class="row">${ICON_APPLE}<div class="grow">
      <p class="verse">「一句話說得合宜，<br>就如金蘋果在銀網子裡。」</p><div class="ref">箴言二十五章 11 節</div></div></div>
      <p class="q2">對的話，配上對的時候。</p>`;
  }else if(st.sub===1){
    const L = kmList(); const n=L.length; const i=Math.min(st.km.i, Math.max(0,n-1)); const it=L[i]||{t:"（請在教員提示欄輸入句子）",k:null};
    const sh = st.km.shown;
    const cls = k=> sh? (sh===k?"win":"lose") : "";
    body = `<div class="kmgame">
      <div class="ref">「說話浮躁的，如刀刺人；智慧人的舌頭，卻為醫人的良藥。」（箴十二18）</div>
      <div class="sentence">「${esc(it.t)}」</div>
      <div class="verdict">
        <button type="button" class="vcard knife ${cls("knife")}" id="vK">${ICON_KNIFE}刀子</button>
        <button type="button" class="vcard med ${cls("med")}" id="vM">${ICON_MED}藥</button>
      </div>
      <div class="kmnav"><button class="bigbtn" type="button" id="kmPrev">上一句</button><span class="counter">${n?i+1:0} / ${n}</span><button class="bigbtn solid" type="button" id="kmNext">下一句</button></div>
    </div>`;
  }else{
    body = `<p class="q">行動之前，先等一等</p>
      <ul class="reveal">
        <li><span class="n">!</span>玩得太高興，可能撞到人、弄壞東西</li>
        <li><span class="n">!</span>想搶快、不排隊，會推到別人</li>
        <li><span class="n">!</span>輸了生氣摔東西，會傷到人</li>
      </ul>
      <div class="pill">挑戰：小恩看到同學跌倒，他可以……？玩遊戲輸了，他可以……？</div>`;
  }
  stage.innerHTML = `<div class="eyebrow">說話前先想一想・行動前先等一等</div>
    <div class="subtabs" role="tablist">${tabs.map((t,i)=>`<button type="button" role="tab" data-s="${i}" aria-selected="${i===st.sub}">${t}</button>`).join("")}</div>${body}`;
  stage.querySelectorAll(".subtabs button").forEach(b=>b.onclick=()=>{st.sub=+b.dataset.s; if(st.sub===2){st.keysOn.add(0);st.keysOn.add(1);} render();});
  if(st.sub===1){
    $("#vK").onclick=()=>kmShow(); $("#vM").onclick=()=>kmShow();
    $("#kmNext").onclick=()=>kmStep(1); $("#kmPrev").onclick=()=>kmStep(-1);
  }
}
function kmShow(){ const L=kmList(); const it=L[st.km.i]; if(!it) return; st.km.shown = it.k||"med"; r3(); }
function kmStep(d){ const n=kmList().length; if(!n) return; st.km.i=(st.km.i+d+n)%n; st.km.shown=null; r3(); }

function r4(){
  const steps = ["他不是故意的","說出自己的感受：有點生氣、有點難過","請他一起把作業簿弄乾"];
  stage.innerHTML = `<div class="eyebrow">包容與和好</div>
   <p class="q2">同學經過時打翻你的杯子，水弄濕了作業簿，你會怎麼做？</p>
   <ol class="reveal">${steps.map((s,i)=>`<li class="${i<st.rev4?"":"hidden"}"><span class="n">${i+1}</span>${s}</li>`).join("")}</ol>
   <div class="row"><button class="bigbtn solid" type="button" id="r4next">${st.rev4<3?"揭開下一步":"重新開始"}</button></div>
   <div><p class="verse" style="font-size:clamp(1.2rem,2.4vw,2.1rem)">「不以惡報惡，以辱罵還辱罵，倒要祝福。」</p><div class="ref">彼得前書三章 9 節</div></div>`;
  $("#r4next").onclick=()=>{ st.rev4 = st.rev4<3? st.rev4+1 : 0; if(st.rev4===3) st.keysOn.add(2); render(); };
}

const VERSE = ["朋友","乃","時常","親愛，","弟兄","為","患難","而生。"];
function r5(){
  stage.innerHTML = `<div class="eyebrow">幫助別人・背誦經句</div>
   <div class="mem" id="mem">${VERSE.map((w,i)=>`<span class="${st.mem.has(i)?"blank":""}" data-i="${i}">${w}</span>`).join("")}</div>
   <div class="ref" style="text-align:center">箴言十七章 17 節</div>
   <div class="row" style="justify-content:center"><button class="bigbtn solid" type="button" id="hide1">藏起一個詞</button><button class="bigbtn" type="button" id="showAll">全部顯示</button></div>
   <div class="row" style="align-items:stretch">
     <div class="grow pill" style="border-radius:16px;padding:12px 18px;display:block">約拿單趕快告訴大衛快逃，<br>不讓掃羅殺害他。</div>
     <div class="grow pill" style="border-radius:16px;padding:12px 18px;display:block;background:var(--gold-soft)">挑戰：哪些事情<b>不能</b>幫忙？</div>
   </div>`;
  $("#hide1").onclick=()=>{ const left=VERSE.map((_,i)=>i).filter(i=>!st.mem.has(i)); if(!left.length) return; st.mem.add(left[Math.floor(Math.random()*left.length)]); st.keysOn.add(3); render(); };
  $("#showAll").onclick=()=>{ st.mem.clear(); r5(); };
  stage.querySelectorAll("#mem span").forEach(s=>s.onclick=()=>{const i=+s.dataset.i; st.mem.has(i)?st.mem.delete(i):st.mem.add(i); r5();});
}

/* ---------- ladder ---------- */
function makeLadder(n){
  const R = 9, rungs=[];
  for(let r=0;r<R;r++){
    const row=[]; for(let g=0;g<n-1;g++){ row.push(!row[g-1] && Math.random()<0.45); } rungs.push(row);
  }
  for(let g=0;g<n-1;g++){ if(!rungs.some(r=>r[g])){ const r=Math.floor(Math.random()*R); rungs[r][g]=true; if(g>0) rungs[r][g-1]=false; if(g<n-2) rungs[r][g+1]=false; } }
  const pool = (n===5? CARDS.filter(c=>c.star) : CARDS.slice()).sort(()=>Math.random()-.5);
  return {n,R,rungs,cards:pool};
}
function trace(L,c){
  const pts=[c]; let col=c;
  for(let r=0;r<L.R;r++){ if(col>0 && L.rungs[r][col-1]) col--; else if(col<L.n-1 && L.rungs[r][col]) col++; pts.push(col); }
  return pts;
}
function r6(){
  KEYS.forEach((_,i)=>st.keysOn.add(i)); document.querySelectorAll(".key").forEach(k=>k.classList.add("on"));
  if(!st.ladder || st.ladder.n!==st.cardCount) { st.ladder = makeLadder(st.cardCount); st.used.clear(); st.opened=null; st.kindPick=null; }
  const L = st.ladder, W=120*L.n, top=70, rowH=46, bottom=top+rowH*(L.R+1), H=bottom+120;
  const x = i=>60+i*120;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="爬格子遊戲圖">`;
  for(let i=0;i<L.n;i++) svg += `<line class="rail" x1="${x(i)}" y1="${top}" x2="${x(i)}" y2="${bottom}"/>`;
  L.rungs.forEach((row,r)=>row.forEach((on,g)=>{ if(on){ const y=top+rowH*(r+1); svg+=`<line class="rung" x1="${x(g)}" y1="${y}" x2="${x(g+1)}" y2="${y}"/>`; } }));
  svg += `<path class="trail" id="trail" d=""/>`;
  for(let i=0;i<L.n;i++){
    const card=L.cards[i], open = [...st.used].some(s=>trace(L,s).at(-1)===i);
    svg += `<g class="lcard ${open?"open":""}" transform="translate(${x(i)-52},${bottom+10})"><rect width="104" height="96" rx="12"/>${open?`<text x="52" y="44" text-anchor="middle">情境</text><text x="52" y="74" text-anchor="middle">${CN[card.id]}</text>`:`<text x="52" y="58" text-anchor="middle">？</text>`}</g>`;
  }
  for(let i=0;i<L.n;i++) svg += `<g class="lnum ${st.used.has(i)?"used":""}" data-i="${i}" tabindex="0" role="button" aria-label="從 ${i+1} 號出發"><circle cx="${x(i)}" cy="${top-32}" r="26"/><text x="${x(i)}" y="${top-23}" text-anchor="middle">${i+1}</text></g>`;
  svg += `</svg>`;

  let panel = `<div class="cardpanel"><div class="empty">請一位小朋友選一個數字，看看會爬到哪一張情境卡。</div></div>`;
  if(st.opened!=null){
    const c = st.opened;
    panel = `<div class="cardpanel">
      <div class="eyebrow">情境${CN[c.id]}</div>
      <p class="q2">${c.t}</p>
      <ol class="ask">${c.ask.map(a=>`<li>${a}</li>`).join("")}</ol>
      <div class="eyebrow">這是哪一種？</div>
      <div class="kinds">${KEYS.map((k,i)=>{ let cl=""; if(st.kindPick!=null){ if(c.kinds.includes(i)) cl="right"; else if(st.kindPick===i) cl="miss"; } return `<button type="button" data-k="${i}" class="${cl}">${k}</button>`; }).join("")}</div>
      <div class="fb">${st.kindPick==null?"":(c.kinds.includes(st.kindPick)?"答對了！":"再想想看，綠色的是比較適合的答案。")}${st.kindPick!=null && c.kinds.length>1?"（這張卡兩種都可以）":""}</div>
    </div>`;
  }
  stage.innerHTML = `<div class="ladderbar"><div class="eyebrow" style="flex:1">爬格子情境卡</div>
     <label for="cardCount">卡片數</label><select id="cardCount"><option value="5" ${st.cardCount===5?"selected":""}>五張（建議）</option><option value="8" ${st.cardCount===8?"selected":""}>八張</option></select>
     <button class="bigbtn" type="button" id="reLadder" style="padding:6px 14px">重排格子</button></div>
     <div class="ladderbox"><div class="svgwrap">${svg}</div>${panel}</div>`;
  $("#cardCount").onchange=e=>{ st.cardCount=+e.target.value; st.ladder=null; r6(); };
  $("#reLadder").onclick=()=>{ st.ladder=null; r6(); };
  stage.querySelectorAll(".lnum").forEach(g=>{ const go=()=>climb(+g.dataset.i); g.addEventListener("click",go); g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}}); });
  stage.querySelectorAll(".kinds button").forEach(b=>b.onclick=()=>{ st.kindPick=+b.dataset.k; r6(); });
}
function climb(start){
  if(st.used.has(start) || st.climbing) return;
  const L=st.ladder, top=70,rowH=46, bottom=top+rowH*(L.R+1), x=i=>60+i*120;
  const cols = trace(L,start);
  let d=`M${x(start)} ${top}`, col=start;
  for(let r=0;r<L.R;r++){ const y=top+rowH*(r+1); d+=` L${x(col)} ${y}`; const nc=cols[r+1]; if(nc!==col){ d+=` L${x(nc)} ${y}`; col=nc; } }
  d+=` L${x(col)} ${bottom}`;
  const p=$("#trail"); p.setAttribute("d",d);
  const len=p.getTotalLength(); p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
  st.climbing=true;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dur = reduce?0:2200, t0=performance.now();
  const tick=now=>{ const k=dur?Math.min(1,(now-t0)/dur):1; p.style.strokeDashoffset = len*(1-k); if(k<1) requestAnimationFrame(tick); else { setTimeout(()=>{ st.climbing=false; st.used.add(start); st.opened=L.cards[col]; st.kindPick=null; r6(); }, reduce?0:350); } };
  requestAnimationFrame(tick);
}

function r7(){
  KEYS.forEach((_,i)=>st.keysOn.add(i));
  document.querySelectorAll(".key").forEach(k=>k.classList.add("on"));
  stage.innerHTML = `<div class="eyebrow">結語</div>
   <p class="q">大家喜愛的朋友</p>
   <ul class="reveal">
    <li><span class="n">1</span>注意自己的話和行為，不讓朋友受傷</li>
    <li><span class="n">2</span>懂得包容，願意原諒</li>
    <li><span class="n">3</span>朋友需要時主動幫忙，但只幫對的事</li>
   </ul>
   <div class="mem" style="margin-top:8px"><span>朋友乃時常親愛，</span><span>弟兄為患難而生。</span></div>
   <div class="ref" style="text-align:center">箴言十七章 17 節</div>`;
}

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- navigation ---------- */
function go(i){ st.step=Math.max(0,Math.min(STEPS.length-1,i)); render(); stage.scrollTop=0; }
$("#steps").addEventListener("click",e=>{ const b=e.target.closest(".step"); if(b) go(+b.dataset.i); });
$("#prevBtn").onclick=()=>go(st.step-1);
$("#nextBtn").onclick=()=>go(st.step+1);
$("#teachBtn").onclick=()=>{ const on = drawer.hidden; drawer.hidden=!on; $("#teachBtn").setAttribute("aria-pressed", String(on)); };

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select")) return;
  if(e.key==="ArrowRight") go(st.step+1);
  else if(e.key==="ArrowLeft") go(st.step-1);
  else if(e.key==="t"||e.key==="T") $("#teachBtn").click();
  else if(st.step===2 && st.sub===1){
    if(e.key==="k"||e.key==="K"||e.key==="m"||e.key==="M") kmShow();
    else if(e.key==="n"||e.key==="N") kmStep(1);
  }
  else if(st.step===3 && e.key===" "){ e.preventDefault(); $("#r4next").click(); }
  else if(st.step===1 && e.key===" "){ e.preventDefault(); const i=st.cover.indexOf(false); if(i>-1){ st.cover[i]=true; r2(); } }
});

/* ---------- clock ---------- */
let t0=null, timer=null;
$("#clockBtn").onclick=()=>{
  if(timer){ clearInterval(timer); timer=null; $("#clockBtn").textContent="繼續計時"; t0={paused:Date.now()-t0.start}; return; }
  const base = t0&&t0.paused? t0.paused : 0;
  t0={start:Date.now()-base};
  timer=setInterval(()=>{ const s=Math.floor((Date.now()-t0.start)/1000); $("#clock").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); },500);
  $("#clockBtn").textContent="暫停";
  try{ navigator.wakeLock && navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
};

if(window.innerWidth<820){ drawer.hidden=true; $("#teachBtn").setAttribute("aria-pressed","false"); }
render();
</script>
